# =============================================================================
# Configuración del análisis de SonarQube Cloud (SonarCloud)
# -----------------------------------------------------------------------------
# Lo lee el scanner que corre en GitHub Actions (.github/workflows/sonarcloud.yml).
#
# ⚠️ projectKey y organization tienen que coincidir EXACTAMENTE con los que
#    SonarCloud genera al importar el repositorio. Se ven en:
#    SonarCloud -> el proyecto -> Information (o en el tutorial de la importación).
# =============================================================================

sonar.projectKey=julietazuccaro_PI-riesgo-crediticio-M5
# OJO: la key de la organización NO es el prefijo del projectKey. Ese prefijo lo
# genera SonarCloud a partir del dueño del repo en GitHub, mientras que la key de
# la organización es la que aparece en sonarcloud.io/organizations/<KEY>/projects.
sonar.organization=jdz6163170
sonar.projectName=PI Riesgo Crediticio M5
sonar.projectVersion=1.3.1

# --- Qué se analiza ----------------------------------------------------------
# Sólo el código fuente del pipeline. Se excluyen:
#   - los tests, que se declaran aparte como `sonar.tests` (si quedaran dentro de
#     `sources`, Sonar los auditaría como código de producción y además pediría
#     cobertura sobre ellos mismos);
#   - el notebook del EDA, que es código exploratorio y no productivo;
#   - los cachés de Python.
sonar.sources=mlops_pipeline/src
sonar.exclusions=**/test_*.py,**/*.ipynb,**/__pycache__/**

sonar.tests=mlops_pipeline/src
sonar.test.inclusions=**/test_*.py

# --- Cobertura ---------------------------------------------------------------
# El workflow genera coverage.xml con pytest-cov antes de lanzar el scanner.
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml

# La app de Streamlit se excluye del cálculo de cobertura (no del análisis de
# calidad): es un script que se ejecuta de arriba abajo al importarse, sin
# funciones que un test unitario pueda invocar. Se valida con
# streamlit.testing.v1.AppTest, que no produce reporte de cobertura.
sonar.coverage.exclusions=**/app_monitoreo.py

sonar.sourceEncoding=UTF-8
